name: Update MarkSix Data

on:
  # Free hosted minutes exhausted until ~2026-12-01. Prefer macOS launchd /
  # quant-sg cron until then. Re-enable schedule after quota resets; HKJC
  # GraphQL is the primary fetch source and should work from hosted runners.
  # schedule:
  #   - cron: '30 14 * * 2,4,6'  # 22:30 Asia/Singapore on draw nights
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动更新'

jobs:
  update:
    runs-on: ubuntu-latest
    # Cap so a stuck source cannot hold the runner.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & merge data
        run: python scripts/update.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet frontend/public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          git commit -m "auto: update MarkSix data $(date +%Y-%m-%d)"
          git push

      - name: No changes
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No new data found."
