name: Update Backend Data

on:
  schedule:
    # MarkSix: Tue/Thu/Sat after 21:30 Asia/Shanghai.
    # SSQ: Tue/Thu/Sun after 21:15 Asia/Shanghai.
    # Run at 22:30 Asia/Shanghai (14:30 UTC) on every draw day.
    - cron: '30 14 * * 0,2,4,6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # curl has no default timeout. Cap the job, and each request, so a scrape
    # blocked on an unreachable source cannot run until the 6-hour default.
    timeout-minutes: 5
    steps:
      - name: Trigger latest draw scrape
        run: |
          curl -fsS --retry 2 --retry-delay 5 --retry-all-errors --max-time 60 \
            -X POST "${{ secrets.API_BASE_URL }}/api/v1/jackpot/scrape"

      - name: Wait for data import
        run: sleep 5

      - name: Check MarkSix health
        run: |
          curl -fsS --max-time 20 "${{ secrets.API_BASE_URL }}/api/v1/health?lottery_type=marksix"
          curl -fsS --max-time 20 "${{ secrets.API_BASE_URL }}/api/v1/jackpot/latest?lottery_type=marksix"

      - name: Check SSQ health
        run: |
          curl -fsS --max-time 20 "${{ secrets.API_BASE_URL }}/api/v1/health?lottery_type=ssq"
          curl -fsS --max-time 20 "${{ secrets.API_BASE_URL }}/api/v1/jackpot/latest?lottery_type=ssq"
